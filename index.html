<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>photo-museum</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="stage">
  <div id="app"></div>
  <div class="vignette"></div>

  <header id="hud">
    <span class="brand">photo-museum</span>
    <span id="room">ROOM 01</span>
  </header>

  <button id="minimap" aria-label="전시장 지도 열기"><canvas></canvas></button>

  <p id="hint"></p>
  <div id="toast"></div>

  <nav id="tools">
    <button data-act="photos">+ 사진</button>
    <button data-act="room">+ 방</button>
    <button data-act="theme" aria-label="이 방 색 바꾸기">◐ 방 색</button>
  </nav>

  <div id="map" role="dialog" aria-label="전시장 지도">
    <div class="bar">
      <b>전시장 지도</b>
      <span class="tip">방을 누르면 그 방으로 가요</span>
      <button data-act="edit">편집</button>
      <button data-act="close" class="quiet" aria-label="닫기">✕</button>
    </div>
    <div class="rooms"></div>
  </div>

  <div id="sheet" role="dialog" aria-label="메뉴"></div>
  <div id="loading">전시장을 준비하고 있어요</div>
  </div>

  <!-- 조이스틱은 돌린 화면 밖에 둔다 (실제 화면 좌표로 동작) -->
  <div id="joy"></div>
  <input id="file" type="file" accept="image/*" multiple hidden>

  <div id="editor" role="dialog" aria-label="설명 쓰기">
    <div class="box">
      <label for="caption">사진 설명</label>
      <textarea id="caption" maxlength="300" rows="5" placeholder="첫 줄은 제목처럼 보여요&#10;예) 제주, 겨울 바다&#10;2025. 1. 아침 7시"></textarea>
      <div class="row">
        <button id="editor-cancel" class="quiet">취소</button>
        <button id="editor-save">저장</button>
      </div>
    </div>
  </div>

  <script src="vendor/nipplejs.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Photo Museum">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="assets/icons/icon-192.png">
  <title>Photo Museum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 글씨체: js/fonts.js 와 같이 바꾼다. 기본은 프리텐다드 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Diphylleia&family=Hahmlet:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="stage">
  <div id="app"></div>
  <div class="vignette"></div>

  <header id="hud">
    <button id="home-btn" aria-label="홈으로">‹ 홈</button>
    <span id="ex-title"></span>
    <span id="room">입구</span>
  </header>

  <button id="nav-prev" class="nav" aria-label="이전 사진으로"><small>이전</small><span>‹</span></button>
  <button id="nav-next" class="nav" aria-label="다음 사진으로"><small>다음</small><span>›</span></button>
  <button id="goto" aria-label="가까운 사진 앞으로 가기"><i>◎</i><span>사진 앞으로</span></button>
  <button id="minimap" aria-label="전시장 지도 열기"><canvas></canvas></button>

  <p id="hint"></p>

  <div id="guide" role="status" aria-live="polite">
    <span class="lbl">지금 할 일</span>
    <p class="task"></p>
    <button data-g="pass" class="quiet">건너뛰기</button>
  </div>
  <div id="guide-modal" role="dialog" aria-modal="true" aria-label="사용법 안내">
    <div class="card">
      <div class="dots"></div>
      <span class="count"></span>
      <h2 class="title"></h2>
      <p class="text"></p>
      <div class="row">
        <button data-g="skip" class="quiet">그만 보기</button>
        <button data-g="go">다음</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <button id="tour-stop" type="button">■ 관람 멈추기</button>
  <button id="undo" type="button" aria-label="되돌리기">↶ 되돌리기 <span></span></button>

  <nav id="tools">
    <button data-act="tour" class="tour" aria-label="관람 모드: 사진을 차례로 보여 줘요">▶ 관람</button>
    <button data-act="photos">+ 사진</button>
    <button data-act="room">+ 방</button>
    <button data-act="theme" aria-label="이 방 꾸미기">◐ 방 꾸미기</button>
  </nav>

  <div id="map" role="dialog" aria-label="전시장 지도">
    <div class="bar">
      <b>전시장 지도</b>
      <span class="tip">방을 누르면 그 방으로 가요</span>
      <button data-act="edit">편집</button>
      <button data-act="close" class="quiet" aria-label="닫기">✕</button>
    </div>
    <div class="rooms"></div>
  </div>

  <div id="style-panel" role="dialog" aria-label="방 꾸미기">
    <div class="top">
      <div><b class="ttl">방 꾸미기</b><span class="now"></span></div>
      <div class="tabs" role="tablist"><button data-tab="wall">벽</button><button data-tab="ceil">천장</button><button data-tab="floor">바닥</button><button data-tab="light">조명</button></div>
      <button class="reset" hidden>추천대로</button>
      <button class="close" aria-label="닫기">✕</button>
    </div>
    <p class="rec" hidden></p>
    <div class="items"></div>
  </div>

  <div id="sheet" role="dialog" aria-label="메뉴"></div>
  <section id="home" aria-label="전시실 고르기">
    <div class="hbg2" aria-hidden="true"><i class="g1"></i><i class="g2"></i><i class="g3"></i><span class="floor"></span></div>
    <header>
      <div><span class="eyebrow">나만의 사진 전시실</span><h1 class="wordmark"><i>Photo</i> Museum</h1></div>
      <div class="hbtns">
        <button id="h-backup" aria-label="백업과 불러오기">⤓ 보관</button>
        <button id="h-styles"><span class="lg">방 스타일 둘러보기</span><span class="sm">방 스타일</span></button>
        <button id="h-tour" class="main">✦ <span class="lg">사용법 둘러보기</span><span class="sm">사용법</span></button>
      </div>
    </header>
    <div class="flow" role="listbox" aria-label="전시실"></div>
    <div class="fcap" aria-live="polite"><b></b><span></span><div class="acts"><button class="go">들어가기 →</button><button class="more" aria-label="전시실 메뉴">⋯</button></div></div>
    <div id="cover-pick" role="dialog" aria-label="대표 사진 고르기">
      <div class="box">
        <div class="top"><b class="ttl">대표 사진</b><button class="close" aria-label="닫기">✕</button></div>
        <p>홈에 크게 보일 사진을 골라 주세요.</p>
        <div class="grid"></div>
      </div>
    </div>
  </section>

  <div id="loading">전시장을 준비하고 있어요</div>
  </div>

  <!-- 조이스틱은 돌린 화면 밖에 둔다 (실제 화면 좌표로 동작) -->
  <div id="joy"></div>
  <input id="file" type="file" accept="image/*" multiple hidden>

  <div id="editor" role="dialog" aria-label="설명 쓰기">
    <div class="box">
      <p class="head" id="ed-head">사진 설명</p>
      <p id="ed-tip" hidden></p>
      <label for="ed-title" id="ed-title-label" class="t">이름</label>
      <input id="ed-title" class="t" maxlength="60" autocomplete="off">
      <label for="caption" id="ed-body-label">사진 설명</label>
      <textarea id="caption" maxlength="600" rows="5"></textarea>
      <p class="fl f" id="ed-font-label">글씨체</p>
      <div id="ed-fonts" class="f" role="radiogroup" aria-labelledby="ed-font-label"></div>
      <div class="row">
        <button id="editor-cancel" class="quiet">취소</button>
        <button id="editor-save">저장</button>
      </div>
    </div>
  </div>

  <div id="guestbook" role="dialog" aria-label="방명록">
    <div class="box">
      <p class="head">방명록</p>
      <div id="gb-list"></div>
      <label for="gb-text">한마디</label>
      <textarea id="gb-text" maxlength="200" rows="3" placeholder="전시를 보고 든 생각, 그날의 기억, 무엇이든요"></textarea>
      <div class="row2">
        <input id="gb-name" maxlength="20" placeholder="이름 (안 써도 돼요)" autocomplete="off" aria-label="이름">
        <div id="gb-colors" aria-label="쪽지 색"></div>
      </div>
      <div class="row">
        <button id="gb-close" class="quiet">닫기</button>
        <button id="gb-save">남기기</button>
      </div>
    </div>
  </div>

  <script src="vendor/nipplejs.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>

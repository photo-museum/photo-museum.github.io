<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Photo Museum">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="assets/icons/icon-192.png">
  <title>Photo Museum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 글씨체: js/fonts.js 와 같이 바꾼다. 기본은 프리텐다드 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Diphylleia&family=Hahmlet:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ios.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="stage">
  <div id="app"></div>
  <div class="vignette"></div>

  <header id="hud">
    <button id="home-btn" aria-label="홈으로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
    <div class="pill"><span id="ex-title"></span><i class="sep" aria-hidden="true"></i><span id="room">입구</span></div>
  </header>

  <button id="nav-prev" class="nav" aria-label="이전 사진으로"><small>이전</small><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></span></button>
  <button id="nav-next" class="nav" aria-label="다음 사진으로"><small>다음</small><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></button>
  <button id="goto" aria-label="가까운 사진 앞으로 가기"><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></i><span>사진 앞으로</span></button>
  <aside id="cap-side" aria-live="polite"><b></b><p></p></aside>
  <button id="minimap" aria-label="전시장 지도 열기"><canvas></canvas></button>

  <p id="hint"></p>

  <div id="guide" role="status" aria-live="polite">
    <span class="lbl">지금 할 일</span>
    <p class="task"></p>
    <button data-g="pass" class="quiet">건너뛰기</button>
  </div>
  <div id="guide-modal" role="dialog" aria-modal="true" aria-label="사용법 안내">
    <div class="card">
      <div class="dots"></div>
      <span class="count"></span>
      <h2 class="title"></h2>
      <p class="text"></p>
      <div class="row">
        <button data-g="skip" class="quiet">그만 보기</button>
        <button data-g="go">다음</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <button id="tour-stop" type="button">■ 관람 멈추기</button>
  <button id="undo" type="button" aria-label="되돌리기">↶ 되돌리기 <span></span></button>

  <nav id="tools" aria-label="관람과 편집">
    <button data-act="tour" class="tour" aria-label="관람 모드: 사진을 차례로 보여 줘요"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13l10.5-6.5z"/></svg><span>관람</span></button>
    <button data-act="edit" aria-expanded="false" aria-controls="edit-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg><span>편집</span></button>
  </nav>
  <div id="edit-menu" role="menu" aria-label="편집">
    <button role="menuitem" data-act="photos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg><span><b>사진 넣기</b><small>이 방의 빈 판에 걸어요</small></span></button>
    <button role="menuitem" data-act="theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-1.5-1.2-2-2.4-2H16a2 2 0 0 1-2-2V6.5C14 4.6 13.3 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10" cy="7" r="1.2"/></svg><span><b>방 꾸미기</b><small>벽 · 천장 · 바닥 · 조명</small></span></button>
    <button role="menuitem" data-act="room"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg><span><b>방 만들기</b><small>끝에 새 방을 붙여요</small></span></button>
  </div>

  <div id="map" role="dialog" aria-label="전시장 지도">
    <div class="bar">
      <b>전시장 지도</b>
      <span class="tip">방을 누르면 그 방으로 가요</span>
      <div class="zoom" role="group" aria-label="지도 크기"><button data-z="-1" aria-label="작게 (방만 보기)">−</button><button data-z="1" aria-label="크게 (사진 보기)">+</button></div>
      <button data-act="close" class="quiet" aria-label="닫기">✕</button>
    </div>
    <div class="rooms"></div>
  </div>

  <div id="style-panel" role="dialog" aria-label="방 꾸미기">
    <div class="top">
      <div><span class="tl"><button class="pick" data-d="-1" aria-label="앞쪽 방 꾸미기">‹</button><b class="ttl">방 꾸미기</b><button class="pick" data-d="1" aria-label="뒤쪽 방 꾸미기">›</button></span><span class="now"></span></div>
      <div class="tabs" role="tablist"><button data-tab="wall">벽</button><button data-tab="ceil">천장</button><button data-tab="floor">바닥</button><button data-tab="light">조명</button></div>
      <button class="follow" hidden>첫 방과 같게</button>
      <button class="reset" hidden>추천대로</button>
      <button class="close" aria-label="닫기">✕</button>
    </div>
    <p class="rec" hidden></p>
    <div class="items"></div>
  </div>

  <div id="sheet" role="dialog" aria-label="메뉴"></div>
  <section id="home" aria-label="전시실 고르기">
    <div class="hbg3" aria-hidden="true"><div class="ph"></div><div class="ph"></div><div class="shade"></div></div>
    <div class="flow" aria-hidden="true"></div>
    <header>
      <span class="brand">Photo Museum</span>
      <div class="hbtns">
        <button id="h-backup" aria-label="보관: 백업과 불러오기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
        <button id="h-styles" aria-label="방 스타일 둘러보기"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path class="fill" d="M12 3a9 9 0 0 0 0 18z"/></svg></button>
        <button id="h-tour" aria-label="사용법 둘러보기"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.5M12 17h.01"/></svg></button>
      </div>
    </header>
    <div class="fcap" aria-live="polite"><small class="cnt"></small><b></b><span></span><div class="acts"><button class="go">들어가기</button><button class="more" aria-label="전시실 메뉴"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="fill" cx="5" cy="12" r="1.8"/><circle class="fill" cx="12" cy="12" r="1.8"/><circle class="fill" cx="19" cy="12" r="1.8"/></svg></button></div></div>
    <div class="hstrip" role="listbox" aria-label="전시실"></div>
    <button id="home-pop" type="button"><span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
    <div id="cover-pick" role="dialog" aria-label="대표 사진 고르기">
      <div class="box">
        <div class="top"><b class="ttl">대표 사진</b><button class="close" aria-label="닫기">✕</button></div>
        <p>홈에 크게 보일 사진을 골라 주세요.</p>
        <div class="grid"></div>
      </div>
    </div>
  </section>

  <div id="loading">전시장을 준비하고 있어요</div>
  </div>

  <!-- 조이스틱은 돌린 화면 밖에 둔다 (실제 화면 좌표로 동작) -->
  <div id="joy"></div>
  <input id="file" type="file" accept="image/*" multiple hidden>

  <div id="editor" role="dialog" aria-label="설명 쓰기">
    <div class="box">
      <p class="head" id="ed-head">사진 설명</p>
      <p id="ed-tip" hidden></p>
      <label for="ed-title" id="ed-title-label" class="t">이름</label>
      <input id="ed-title" class="t" maxlength="60" autocomplete="off">
      <label for="caption" id="ed-body-label">사진 설명</label>
      <textarea id="caption" maxlength="600" rows="5"></textarea>
      <p class="fl f" id="ed-font-label">글씨체</p>
      <div id="ed-fonts" class="f" role="radiogroup" aria-labelledby="ed-font-label"></div>
      <div class="row">
        <button id="editor-cancel" class="quiet">취소</button>
        <button id="editor-save">저장</button>
      </div>
    </div>
  </div>

  <div id="guestbook" role="dialog" aria-label="방명록">
    <div class="box">
      <p class="head">방명록</p>
      <div id="gb-list"></div>
      <label for="gb-text">한마디</label>
      <textarea id="gb-text" maxlength="200" rows="3" placeholder="전시를 보고 든 생각, 그날의 기억, 무엇이든요"></textarea>
      <div class="row2">
        <input id="gb-name" maxlength="20" placeholder="이름 (안 써도 돼요)" autocomplete="off" aria-label="이름">
        <div id="gb-colors" aria-label="쪽지 색"></div>
      </div>
      <div class="row">
        <button id="gb-close" class="quiet">닫기</button>
        <button id="gb-save">남기기</button>
      </div>
    </div>
  </div>

  <script src="vendor/nipplejs.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>

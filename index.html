<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>photo-museum</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="vignette"></div>

  <header id="hud">
    <span class="brand">photo-museum</span>
    <span id="room">ROOM 01</span>
  </header>

  <p id="hint"></p>
  <div id="joy"></div>
  <div id="toast"></div>

  <div id="sheet" role="dialog" aria-label="사진">
    <button data-act="view">앞에 가서 보기</button>
    <button data-act="replace">사진 바꾸기</button>
    <button data-act="remove" class="quiet">사진 내리기</button>
    <button data-act="close" class="quiet">닫기</button>
  </div>

  <input id="file" type="file" accept="image/*" hidden>
  <div id="loading">전시장을 준비하고 있어요</div>

  <script src="vendor/nipplejs.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
